name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: Smoke-test the CLI
        run: (python telemetry.py example.csv --minimum -40 --maximum 125 --max-gap 2 > report.json || test $? -eq 1) && python -m json.tool report.json > /dev/null
