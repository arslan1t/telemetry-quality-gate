name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest -v
      - name: Check example exit statuses and report reproducibility
        shell: bash
        run: |
          python telemetry.py example_valid.csv --html-report /tmp/clean-report.html
          status=0
          python telemetry.py example_anomalies.csv --html-report /tmp/example-report.html || status=$?
          test "$status" -eq 1
          cmp example-report.html /tmp/example-report.html
